services:
  # ===========================
  # PostgreSQL Database
  # ===========================
  postgres:
    image: postgres:15
    container_name: dc_sms_portal_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcadmin -d dc_sms_portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ===========================
  # Redis (Optional)
  # ===========================
  redis:
    image: redis:8
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  # ===========================
  # Backend API (Node.js)
  # ===========================
  backend:
    image: danald/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dc_sms_portal_backend_api
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    environment:
      DOCKER: "true"
      NODE_ENV: production
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      SMS_PROVIDER_API_URL: ${SMS_PROVIDER_API_URL}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_SECRET_EXPIRES: 3d
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  
  sms-worker:
    image: danald/backend:latest
    working_dir: /app
    command: npm run worker
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  
  # ===========================
  # Frontend (React → Nginx)
  # ===========================
  frontend:
    image: danald/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
    container_name: dc_sms_portal_frontend_app
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: