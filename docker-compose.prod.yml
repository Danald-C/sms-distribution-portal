services:

  postgres:
    image: postgres:15
    container_name: dc_sms_portal_db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: redis
    restart: always

  backend:
    image: danald/backend:${IMAGE_TAG:-latest}
    container_name: dc_sms_portal_backend_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      DOCKER: "true"
      NODE_ENV: production
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      SMS_PROVIDER_API_URL: ${SMS_PROVIDER_API_URL}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_SECRET_EXPIRES: 3d
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  sms-worker:
    image: danald/backend:${IMAGE_TAG:-latest}
    container_name: dc_sms_portal_sms_worker
    working_dir: /app
    command: npm run worker
    restart: always
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      SMS_PROVIDER_API_URL: ${SMS_PROVIDER_API_URL}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: danald/frontend:${IMAGE_TAG:-latest}
    container_name: dc_sms_portal_frontend_app
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data: